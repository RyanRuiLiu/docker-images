version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/caddy-cloudflare"
    schedule:
      interval: "weekly"
    groups:
      caddy:
        patterns:
          - "caddy*"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker"
    directory: "/sops"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "docker"
    directory: "/litestream"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
