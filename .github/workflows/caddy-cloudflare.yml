name: caddy-cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  pull_request:
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@9d9fb64d2ca92d4fb089d0fd3429ea67db4ea283
    with:
      image_name: caddy-cloudflare
      context: ./caddy-cloudflare
      dockerfile: ./caddy-cloudflare/Dockerfile
      version_pattern: '^FROM caddy:\K[0-9]+\.[0-9]+\.[0-9]+'
      tags: |
        type=ref,event=branch
        type=sha
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  notify:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Caddy sync
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          body="{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
          curl -fsS --max-time 60 --retry 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "X-Signature-256: sha256=$signature" \
            --data-binary "$body" \
            "https://ryanliu.cn/hooks/sync-infra"
      - name: Verify site
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://ryanliu.cn/ || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "site not healthy: $code" >&2
          exit 1
