name: caddy-cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
    tags:
      - 'caddy-*'
  pull_request:
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@d77ab28fc191b7c00b61318cf0d6cdb6867d8902
    with:
      image_name: caddy-cloudflare
      context: ./caddy-cloudflare
      dockerfile: ./caddy-cloudflare/Dockerfile
      tags: |
        type=match,pattern=caddy-(\d+\.\d+\.\d+),group=1
        type=sha
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
