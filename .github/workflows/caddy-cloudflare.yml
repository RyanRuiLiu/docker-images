name: caddy-cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  pull_request:
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@ab0dbbcfb12dfa191e3fc34d0df94b4bc64f240b
    with:
      image_name: caddy-cloudflare
      context: ./caddy-cloudflare
      dockerfile: ./caddy-cloudflare/Dockerfile
      tags: |
        type=ref,event=branch
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  notify:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Caddy sync
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          body="{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
          curl -fsS --max-time 60 --retry 5 --retry-all-errors -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$body" \
            "https://ryanliu.cn/hooks/sync-infra"
      - name: Wait for Caddy sync
        run: |
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 5 https://ryanliu.cn/hooks/sync-status || true)
            state=$(printf '%s' "$body" | jq -r '.state // empty' 2>/dev/null || true)
            sha=$(printf '%s' "$body" | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$sha" = "$GITHUB_SHA" ]; then
              if [ "$state" = "success" ]; then
                echo "sync succeeded"
                exit 0
              fi
              if [ "$state" = "failed" ]; then
                echo "sync failed: $body" >&2
                exit 1
              fi
            fi
            sleep 5
          done
          echo "sync status timeout: $body" >&2
          exit 1
      - name: Verify site
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://ryanliu.cn/ || true)
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "site not healthy: $code" >&2
          exit 1
