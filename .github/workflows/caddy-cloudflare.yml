name: caddy-cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  pull_request:
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@9e85e2e21780ed63ba09054f504a8d2139d87a9d
    with:
      image_name: caddy-cloudflare
      context: ./caddy-cloudflare
      dockerfile: ./caddy-cloudflare/Dockerfile
      tags: |
        type=ref,event=branch
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  notify:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: sync-infra
      cancel-in-progress: false
    uses: RyanRuiLiu/.github/.github/workflows/deploy.yml@169a0eb839dd876dbe30a5dd9aa5bd843c73190b
    with:
      hook: sync-infra
      status-hook: sync-status
      timeout-seconds: 60
      verify-url: https://ryanliu.cn/
    secrets:
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
