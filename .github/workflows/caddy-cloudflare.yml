name: caddy-cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  pull_request:
    paths:
      - 'caddy-cloudflare/**'
      - '.github/workflows/caddy-cloudflare.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@9d9fb64d2ca92d4fb089d0fd3429ea67db4ea283
    with:
      image_name: caddy-cloudflare
      context: ./caddy-cloudflare
      dockerfile: ./caddy-cloudflare/Dockerfile
      version_pattern: '^FROM caddy:\K[0-9]+\.[0-9]+\.[0-9]+'
      tags: |
        type=ref,event=branch
        type=sha
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
