name: litestream

on:
  push:
    branches:
      - main
    paths:
      - 'litestream/**'
      - '.github/workflows/litestream.yml'
  pull_request:
    paths:
      - 'litestream/**'
      - '.github/workflows/litestream.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@ab0dbbcfb12dfa191e3fc34d0df94b4bc64f240b
    with:
      image_name: litestream
      context: ./litestream
      dockerfile: ./litestream/Dockerfile
      tags: |
        type=ref,event=branch
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  notify:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-status-panel
      cancel-in-progress: false
    uses: RyanRuiLiu/.github/.github/workflows/deploy.yml@655a30434585fe049b55d25aaee77ad1caeddcc8
    with:
      hook: deploy-status-panel
    secrets:
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
