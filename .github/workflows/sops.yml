name: sops

on:
  push:
    branches:
      - main
    paths:
      - 'sops/**'
      - '.github/workflows/sops.yml'
    tags:
      - 'sops-*'
  pull_request:
    paths:
      - 'sops/**'
      - '.github/workflows/sops.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@6e3d10a0691c01ecc1774122c15497ef36c0a4d9
    with:
      image_name: sops
      context: ./sops
      dockerfile: ./sops/Dockerfile
      version_pattern: '^ARG SOPS_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+'
      tags: |
        type=match,pattern=sops-(\d+\.\d+\.\d+),group=1
        type=sha
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
