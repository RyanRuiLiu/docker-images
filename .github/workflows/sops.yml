name: sops

on:
  push:
    branches:
      - main
    paths:
      - 'sops/**'
      - '.github/workflows/sops.yml'
  pull_request:
    paths:
      - 'sops/**'
      - '.github/workflows/sops.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@9e85e2e21780ed63ba09054f504a8d2139d87a9d
    with:
      image_name: sops
      context: ./sops
      dockerfile: ./sops/Dockerfile
      tags: |
        type=ref,event=branch
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
