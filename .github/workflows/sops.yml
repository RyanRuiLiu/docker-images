name: sops

on:
  push:
    branches:
      - main
    paths:
      - 'sops/**'
      - '.github/workflows/sops.yml'
  pull_request:
    paths:
      - 'sops/**'
      - '.github/workflows/sops.yml'
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@9d9fb64d2ca92d4fb089d0fd3429ea67db4ea283
    with:
      image_name: sops
      context: ./sops
      dockerfile: ./sops/Dockerfile
      version_pattern: '^ARG SOPS_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+'
      tags: |
        type=sha
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
